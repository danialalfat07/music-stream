name: CI
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint --if-present || echo "lint warnings"
      - run: npm run fmt:check --if-present || echo "fmt check"
      - run: npm test --if-present
      - run: node -e "require('./server.js'); console.log('server loads')"
