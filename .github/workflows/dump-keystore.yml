name: Dump debug keystore
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then echo "no secret"; exit 1; fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/debug.keystore
          ls -lh /tmp/debug.keystore
          keytool -list -v -keystore /tmp/debug.keystore -storepass android | grep -E "Alias|SHA256|Valid" | head -20
          cp /tmp/debug.keystore ./debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
